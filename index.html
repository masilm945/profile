<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة مسلم هليل العطوي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --black: #0a0a0a; --gray: #1a1a1a; }
        * { box-sizing: border-box; }
        body { background-color: var(--black); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        
        header { background: linear-gradient(to bottom, #1a1a1a, #0a0a0a); padding: 30px 15px; text-align: center; border-bottom: 2px solid var(--gold); }
        header h1 { color: var(--gold); margin: 10px 0; font-size: 1.8rem; }
        
        .container { width: 100%; max-width: 500px; margin: auto; padding: 15px; }
        .post-card { background: var(--gray); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; border-right: 4px solid var(--gold); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { color: var(--gold); font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; text-align: center; }

        .action-btn { display: flex; align-items: center; justify-content: center; background: var(--gold); color: black; padding: 14px; text-decoration: none; border-radius: 8px; font-weight: bold; margin-bottom: 12px; transition: 0.3s; width: 100%; border: none; cursor: pointer; font-size: 1rem; }
        .action-btn:hover { background: #b8962d; transform: translateY(-2px); }
        .action-btn i { margin-left: 10px; font-size: 1.2rem; }
        
        .btn-outline { background: none; border: 1px solid var(--gold); color: var(--gold); }

        .rosary-section { text-align: center; background: #000; padding: 25px; border-radius: 10px; border: 1px solid var(--gold); margin-top: 5px; }
        #counter { font-size: 4.5rem; color: var(--gold); font-weight: bold; margin: 5px 0; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
        .tap-btn { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--gold); background: none; color: var(--gold); font-size: 1.2rem; cursor: pointer; transition: 0.2s; outline: none; margin-bottom: 10px; }
        .tap-btn:active { transform: scale(0.9); }
        .reset-text { font-size: 0.85rem; color: #888; cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }
        
        .footer { text-align: center; padding: 25px; color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <i class="fas fa-user-shield fa-3x" style="color: var(--gold);"></i>
        <h1>مسلم هليل العطوي</h1>
        <p>أخصائي تقنية معلومات | محلل بيانات</p>
    </header>

    <div class="container">
        
        <!-- قسم التواصل -->
        <article class="post-card">
            <h2>تواصل معي مباشرة</h2>
            <a href="https://wa.me/966504219939" class="action-btn">
                <i class="fab fa-whatsapp"></i> 966504219939
            </a>
            <a href="mailto:m.m.945@hotmail.com" class="action-btn">
                <i class="fas fa-envelope"></i> m.m.945@hotmail.com
            </a>
        </article>

        <!-- قسم الملفات والشهادات -->
        <article class="post-card">
            <h2>الملفات المهنية والشهادات</h2>
            <!-- رابط السيرة الذاتية -->
            <a href="CV_ER.pdf" target="_blank" class="action-btn">
                <i class="fas fa-file-pdf"></i> فتح السيرة الذاتية
            </a>
            <!-- رابط ملف الشهادات المجمع -->
            <a href="Certificates.pdf" target="_blank" class="action-btn btn-outline">
                <i class="fas fa-certificate"></i> عرض سجل الدورات التدريبية
            </a>
        </article>

        <!-- قسم المسبحة الذكية -->
        <article class="post-card">
            <h2>مشروعي التقني المدمج</h2>
            <div class="rosary-section">
                <div id="counter">0</div>
                <button class="tap-btn" onclick="increment()">اضغط</button>
                <br>
                <span class="reset-text" onclick="resetCount()">إعادة تصفير العداد</span>
            </div>
        </article>

    </div>

    <div class="footer">تم التطوير بواسطة مسلم العطوي © 2026</div>

    <script>
        let count = 0;
        function increment() {
            count++;
            document.getElementById('counter').innerText = count;
            if (navigator.vibrate) navigator.vibrate(40);
        }
        function resetCount() {
            if(confirm("تصفير العداد؟")) {
                count = 0;
                document.getElementById('counter').innerText = count;
            }
        }
    </script>
</body>
</html>
